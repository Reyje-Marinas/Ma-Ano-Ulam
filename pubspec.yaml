name: ma_ano_ulam
description: "Ma! Ano Ulam? meal planner and recipe helper application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  provider: ^6.1.5+1
  http: ^1.6.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ma_ano_ulam_logo_transparent.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/ma_ano_ulam_logo_transparent.png"
    background_color: "#FFFDF4"
    theme_color: "#4CAF50"